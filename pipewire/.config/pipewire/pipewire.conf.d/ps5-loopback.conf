context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "PS5"
      capture.props = {
        node.name         = "ps5_capture"
        target.object     = "alsa_input.usb-HiFimeDIY_Audio_UR23_USB_SPDIF_Rx-01.analog-stereo"
        audio.position    = [ FL FR ]
        stream.dont-remix = true
        node.latency      = "256/48000"
      }
      playback.props = {
        node.name      = "ps5_playback"
        audio.position = [ FL FR ]
      }
    }
  }
]
